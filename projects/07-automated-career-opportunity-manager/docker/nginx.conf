server {
    listen 80;
    server_name localhost;
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    location /api/crm/ { proxy_pass http://crm:8780; }
    location = /_auth { internal; proxy_pass http://crm:8780/api/crm/auth; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    location /api/ { auth_request /_auth; proxy_pass http://profile:8770; }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~* \.(js|wasm|json)$ { add_header Cache-Control "no-cache"; }
    add_header X-Content-Type-Options nosniff;
}
