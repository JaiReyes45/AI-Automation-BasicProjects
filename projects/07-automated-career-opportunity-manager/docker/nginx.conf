server {
    listen 80;
    server_name localhost;
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    # Docker can assign new addresses after restart; resolve them during requests.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crm_service http://crm:8780;
    set $profile_service http://profile:8770;
    location /api/crm/ { proxy_read_timeout 180s; proxy_pass $crm_service$request_uri; }
    location /api/notifications/ { proxy_set_header Host $host; proxy_pass $crm_service$request_uri; }
    location = /_auth { internal; proxy_pass $crm_service/api/crm/auth; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    location /api/ { auth_request /_auth; proxy_pass $profile_service$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~* \.(js|wasm|json|otf|ttf)$ { add_header Cache-Control "no-cache"; }
    add_header X-Content-Type-Options nosniff;
}
